
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8f0;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #8b2500;
        }

        table {
            width: 90%;
            margin: 25px auto;
            border: 2px solid #8b2500;
            border-collapse: collapse;
            background-color: white;
        }

        caption {
            font-size: 24px;
            font-weight: bold;
            color: #8b2500;
            padding: 12px;
        }

        th, td {
            border: 1px solid #8b2500;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #ffe0cc;
        }

        .starters { background-color: #ffe0cc; }
        .main-course { background-color: #d9f2d9; }
        .desserts { background-color: #ffd9e1; }
        .drinks { background-color: #d9eaff; }

        .category {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Restaurant Menu</h1>

    <table>
        <caption>Today's Special Menu</caption>

        <tr>
            <th>Category</th>
            <th>Food Item</th>
            <th>Price (₹)</th>
        </tr>

        <tr>
            <td class="category starters" rowspan="3">Starters</td>
            <td>Spring Rolls</td>
            <td>120</td>
        </tr>
        <tr>
            <td>Garlic Bread</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Veg Soup</td>
            <td>80</td>
        </tr>

        <tr>
            <td class="category main-course" rowspan="3">Main Course</td>
            <td>Paneer Butter Masala</td>
            <td>180</td>
        </tr>
        <tr>
            <td>Veg Biryani</td>
            <td>150</td>
        </tr>
        <tr>
            <td>Dal Tadka</td>
            <td>120</td>
        </tr>

        <tr>
            <td class="category desserts" rowspan="3">Desserts</td>
            <td>Chocolate Cake</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Ice Cream</td>
            <td>70</td>
        </tr>
        <tr>
            <td>Gulab Jamun</td>
            <td>60</td>
        </tr>

        <tr>
            <td class="category drinks" rowspan="3">Drinks</td>
            <td>Fresh Lime Soda</td>
            <td>50</td>
        </tr>
        <tr>
            <td>Cold Coffee</td>
            <td>80</td>
        </tr>
        <tr>
            <td>Mango Shake</td>
            <td>70</td>
        </tr>
    </table>

</body>
</html>
